<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Industrial Hero Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --steel-dark: #1c1f22;
    --steel-panel: #2a2e32;
    --steel-light: #3d4247;
    --rivet: #7a8288;
    --rivet-dark: #4a4f54;
    --hazard-yellow: #f2c230;
    --warning-orange: #e8622c;
    --text-light: #eae6dc;
    --text-dim: #9aa0a5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--steel-dark);
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 20% 20%, rgba(255,255,255,0.03), transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(0,0,0,0.3), transparent 50%);
    color: var(--text-light);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Hazard tape strip */
  .hazard-strip {
    height: 10px;
    width: 100%;
    background: repeating-linear-gradient(
      45deg,
      var(--hazard-yellow),
      var(--hazard-yellow) 14px,
      #1a1a1a 14px,
      #1a1a1a 28px
    );
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 48px;
    background: linear-gradient(180deg, #24272a 0%, #1c1f22 100%);
    border-bottom: 3px solid var(--rivet-dark);
    position: relative;
  }

  .logo {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--hazard-yellow);
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }

  .logo .plate-dot {
    width: 8px; height: 8px;
    background: var(--warning-orange);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--warning-orange);
  }

  .nav-links {
    display: flex;
    gap: 40px;
    list-style: none;
  }

  .nav-links a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    position: relative;
    padding-bottom: 4px;
    transition: color 0.2s ease;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0%;
    height: 2px;
    background: var(--hazard-yellow);
    transition: width 0.25s ease;
  }

  .nav-links a:hover {
    color: var(--text-light);
  }
  .nav-links a:hover::after { width: 100%; }

  .hero {
    min-height: 82vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
  }

  .plate {
    position: relative;
    background: linear-gradient(155deg, #2e3236 0%, #23262a 60%, #1e2124 100%);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 4px;
    padding: 72px 80px;
    max-width: 780px;
    width: 100%;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.05),
      inset 0 -2px 8px rgba(0,0,0,0.4);
    text-align: center;
  }

  /* Rivets at corners */
  .rivet {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #c4c9cc, var(--rivet) 45%, var(--rivet-dark) 100%);
    box-shadow: 0 2px 3px rgba(0,0,0,0.5), inset 0 -1px 2px rgba(0,0,0,0.3);
  }
  .rivet.tl { top: 16px; left: 16px; }
  .rivet.tr { top: 16px; right: 16px; }
  .rivet.bl { bottom: 16px; left: 16px; }
  .rivet.br { bottom: 16px; right: 16px; }

  /* Hazard tab */
  .hazard-tab {
    position: absolute;
    top: -12px;
    left: 40px;
    background: repeating-linear-gradient(
      45deg,
      var(--hazard-yellow), var(--hazard-yellow) 8px,
      #1a1a1a 8px, #1a1a1a 16px
    );
    color: #1a1a1a;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 5px 14px;
    border-radius: 2px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4);
  }
  .hazard-tab-inner {
    background: var(--steel-dark);
    color: var(--hazard-yellow);
    padding: 2px 8px;
    border-radius: 1px;
  }

  .plate-id {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .plate-id span { color: var(--warning-orange); }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 52px;
    letter-spacing: 1px;
    text-transform: uppercase;
    line-height: 1.15;
    color: var(--text-light);
    text-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }

  h1 .highlight {
    color: var(--hazard-yellow);
  }

  .subtitle {
    margin-top: 20px;
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .divider {
    width: 60px;
    height: 3px;
    background: var(--warning-orange);
    margin: 28px auto;
  }

  .cta {
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(180deg, var(--hazard-yellow), #d9a621);
    color: #1a1a1a;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 16px 32px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    box-shadow: 0 5px 0 #9a7419, 0 8px 16px rgba(0,0,0,0.4);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .cta:active {
    transform: translateY(5px);
    box-shadow: 0 0 0 #9a7419, 0 2px 6px rgba(0,0,0,0.4);
  }
  .cta .bolt-icon {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #333 70%);
  }

  @media (max-width: 600px) {
    h1 { font-size: 34px; }
    .plate { padding: 48px 32px; }
    nav { padding: 18px 20px; }
    .nav-links { display: none; }
  }
</style>
</head>
<body>

<div class="hazard-strip"></div>

<nav>
  <div class="logo"><span class="plate-dot"></span>MR SA 🇿🇦</div>
  <ul class="nav-links">
    <li><a href="#about">About</a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<section class="hero">
  <div class="plate">
    <div class="rivet tl"></div>
    <div class="rivet tr"></div>
    <div class="rivet bl"></div>
    <div class="rivet br"></div>
    <div class="hazard-tab"><span class="hazard-tab-inner">UNIT-01</span></div>

    <div class="plate-id">OPERATOR ID <span>#AM-2026</span></div>
    <h1>Hi, my name is<br><span class="highlight">Alpha Mkhize</span></h1>
    <div class="divider"></div>
    <p class="subtitle">I Build Systems That Run</p>

    <button class="cta"><span class="bolt-icon"></span>Read About My Work</button>
  </div>
</section>

</body>
</html>
