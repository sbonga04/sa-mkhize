      <circle cx="170" cy="170" r="150" fill="none" stroke="#0d0e10" stroke-width="10"/>

      <!-- tick marks -->
      <g stroke="#6d7378" stroke-width="2">
        <line x1="170" y1="30" x2="170" y2="45" transform="rotate(-125 170 170)"/>
        <line x1="170" y1="30" x2="170" y2="45" transform="rotate(-90 170 170)"/>

      <g stroke="#e63946" stroke-width="3">
        <line x1="170" y1="30" x2="170" y2="45" transform="rotate(50 170 170)"/>
        <line x1="170" y1="30" x2="170" y2="45" transform="rotate(97 170 170)"/>

      <g fill="#c9cdd1" font-family="Rajdhani, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
        <text x="72" y="120">3</text>
        <text x="55" y="178">2</text>
        <text x="72" y="235">1</text>
        <text x="100" y="80">4</text>
        <text x="220" y="73">6</text>
        <text x="160" y="65">5</text>

        <text x="270" y="235" fill="#e63946">10</text>
        <text x="265" y="105" fill="#e63946">7</text>
        <text x="278" y="145" fill="#e63946">8</text>

      <g class="needle">

        <circle cx="170" cy="170" r="10" fill="#ffb703"/>
        <circle cx="170" cy="170" r="4" fill="#0d0e10"/>
